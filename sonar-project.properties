# SonarCloud - Analisis de calidad de codigo de NovaMarket
#
# >>> ANTES DE USAR EL PIPELINE: reemplaza estas dos lineas con los valores
#     reales de tu proyecto en https://sonarcloud.io
#     (los ves en:  Proyecto -> Information  /  o al crear el proyecto).
#     Ejemplo:  sonar.projectKey=angelpenagarcia05_ta1_herramientas_tic_pipeline
#               sonar.organization=angelpenagarcia05
# ============================================================

sonar.projectKey=AngelPenaGarcia05_ta1_herramientas_tic_pipeline
sonar.organization=novamarket

sonar.projectName=NovaMarket
sonar.projectVersion=1.0.0

# Codigo a analizar y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Exclusiones (no aportan a calidad/cobertura)
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,prisma/**,**/*.config.*,src/app/**/layout.tsx,src/app/**/globals.css

# Cobertura: reporte LCOV generado por Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
