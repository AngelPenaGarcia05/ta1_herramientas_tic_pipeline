# ============================================================
# SonarCloud - Analisis de calidad de codigo de NovaMarket
#
# Los valores de projectKey / organization se crean en sonarcloud.io
# (ver README > Arquitectura DevOps). Se pasan tambien por el pipeline.
# ============================================================

sonar.projectKey=CAMBIAR-tu-project-key
sonar.organization=CAMBIAR-tu-organization

sonar.projectName=NovaMarket
sonar.projectVersion=1.0.0

# Codigo a analizar y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Exclusiones (no aportan a calidad/cobertura)
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,prisma/**,**/*.config.*,src/app/**/layout.tsx,src/app/**/globals.css

# Cobertura: reporte LCOV generado por Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificacion
sonar.sourceEncoding=UTF-8
