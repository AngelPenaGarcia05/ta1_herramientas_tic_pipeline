name: CI/CD NovaMarket

# Se ejecuta en cada push a main. Los jobs estan ENCADENADOS con "needs":
# si un job falla, los siguientes NO se ejecutan (fail-fast automatico).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: novamarket

jobs:
  # ----------------------------------------------------------
  # (a) Pruebas + calidad de codigo
  # ----------------------------------------------------------
  test-and-quality:
    name: Tests y SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - name: Detectar si SonarCloud esta configurado
        id: sonarcheck
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas + cobertura
        run: npm run test:coverage

      # El analisis solo corre si ya configuraste SonarCloud (secret SONAR_TOKEN
      # + projectKey/organization reales en sonar-project.properties).
      # Mientras tanto el pipeline sigue: los jobs (b) y (c) dependen de este job,
      # no de este paso.
      - name: Analisis SonarCloud
        if: steps.sonarcheck.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud omitido
        if: steps.sonarcheck.outputs.enabled != 'true'
        run: echo "::warning::SonarCloud no configurado (falta el secret SONAR_TOKEN). Paso omitido."

  # ----------------------------------------------------------
  # (b) Build de la imagen Docker + push a Docker Hub
  #     Solo corre si (a) pasa.
  # ----------------------------------------------------------
  build-and-push:
    name: Build y push a Docker Hub
    runs-on: ubuntu-latest
    needs: test-and-quality
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcular tags de la imagen
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # Sin cache de BuildKit: cada push construye la imagen desde cero.
      # (La cache type=gha reutilizaba capas de builds antiguos y publicaba
      # un node_modules obsoleto -> el contenedor fallaba en Render.)
      - name: Build y push (latest + SHA del commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Verificar la imagen publicada
        run: |
          set -e
          docker pull "${IMAGE}:${{ github.sha }}"
          docker run --rm --entrypoint sh "${IMAGE}:${{ github.sha }}" -c \
            'node ./node_modules/prisma/build/index.js -v && node -e "require.resolve(\"effect\")"'
          echo "OK: el CLI de Prisma y sus dependencias funcionan en la imagen publicada."

  # ----------------------------------------------------------
  # (c) Infraestructura como codigo (Terraform -> Render)
  #     Solo corre si (b) pasa.
  # ----------------------------------------------------------
  deploy-infra:
    name: Terraform apply (Render)
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: infra
    env:
      # Variables que consume Terraform (variables.tf).
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_image_tag: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache del estado de Terraform
        # PoC academico: el estado se guarda en la cache de Actions entre
        # ejecuciones. La clave cambia en cada run (la cache de Actions es
        # inmutable) y restore-keys recupera el estado del run anterior.
        # Para produccion real se usaria un backend remoto (Terraform Cloud, S3).
        uses: actions/cache@v4
        with:
          path: infra/terraform.tfstate
          key: novamarket-tfstate-${{ github.run_id }}
          restore-keys: |
            novamarket-tfstate-

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      # Terraform solo CREA el servicio + la base (idempotente: no-op si ya existen).
      # No puede ACTUALIZAR render_web_service en plan free (bug del provider con
      # maintenance_mode), por eso el servicio tiene lifecycle{ignore_changes=all}.
      - name: terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Mostrar URL publica del servicio
        run: terraform output -raw web_service_url || true

      # El deploy de cada version se hace por la API de Render, indicando la imagen
      # EXACTA del commit (:<sha>). Asi no se toca el recurso de Terraform.
      - name: Desplegar la imagen del commit en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e
          SERVICE_ID="$(terraform output -raw web_service_id)"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/novamarket:${GITHUB_SHA}"
          echo "Desplegando ${IMAGE} en ${SERVICE_ID} ..."
          curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"${IMAGE}\"}"
          echo
          echo "Deploy solicitado a Render."
